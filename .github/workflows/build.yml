name: Build VST3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Pack
        shell: bash
        run: |
          mkdir -p out
          find build -name "*.vst3" -maxdepth 4 -exec cp -R {} out/ \;
          ls -R out | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: DrummerViz-${{ matrix.os }}
          path: out
