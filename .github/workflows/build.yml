name: Build VST3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build.log
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee -a build.log
      - name: Errors (only if something failed)
        if: failure()
        shell: bash
        run: grep -n -i -E "error|fatal|cannot find|not found" build.log | head -60 || true
      - name: Pack
        shell: bash
        run: |
          mkdir -p out
          find build -maxdepth 4 -name "*.vst3" -exec cp -R {} out/ \;
          ls -R out || true
      - uses: actions/upload-artifact@v4
        with:
          name: DrummerViz-${{ matrix.os }}
          path: out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.os }}
          path: build.log
